<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cards" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Card Tracker</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <button class="undo" id="undo" type="button" disabled>Undo</button>
        <button class="reset" id="reset" type="button">Reset all totals</button>
      </header>

      <section class="trackers" aria-label="Card counters">
        <article class="tracker dragon">
          <div class="tracker-heading">
            <output id="dragon-total" aria-live="polite">0</output>
          </div>
          <div class="controls">
            <button class="score-button negative" type="button" data-counter="dragon" data-change="-1">
              <span class="change">−1</span><span>4 · 5 · 6 · 7</span>
            </button>
            <button class="score-button positive" type="button" data-counter="dragon" data-change="2">
              <span class="change">+2</span><span>8 · 9</span>
            </button>
          </div>
        </article>

        <article class="tracker panda">
          <div class="tracker-heading">
            <output id="panda-total" aria-live="polite">0</output>
          </div>
          <div class="controls panda-controls">
            <button class="score-button positive" type="button" data-counter="panda" data-change="1"><span class="change">+1</span><span>10 · J · Q · K · A · 2</span></button>
            <button class="score-button negative" type="button" data-counter="panda" data-change="-2"><span class="change">−2</span><span>3 · 4 · 5 · 8</span></button>
            <button class="score-button negative" type="button" data-counter="panda" data-change="-1"><span class="change">−1</span><span>6 · 7</span></button>
            <button class="score-button positive" type="button" data-counter="panda" data-change="4"><span class="change">+4</span><span>9</span></button>
          </div>
        </article>

        <article class="tracker deck">
          <div class="tracker-heading">
            <output id="deck-total" aria-live="polite">0</output>
          </div>
          <div class="controls">
            <button class="score-button neutral" type="button" data-counter="deck" data-change="4"><span class="change">+4</span></button>
            <button class="score-button neutral" type="button" data-counter="deck" data-change="5"><span class="change">+5</span></button>
            <button class="score-button neutral" type="button" data-counter="deck" data-change="6"><span class="change">+6</span></button>
          </div>
        </article>
      </section>
      <p class="hint">Totals are saved on this device.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
